<div class="app-layout">
  <!-- Top Navigation Bar -->
  <header class="app-navbar">
    <div class="navbar-container">
      <a routerLink="/" class="navbar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <rect width="24" height="24" rx="6" fill="#0D99FF"/>
            <path d="M7 6h5a3 3 0 0 1 0 6H7V6z" fill="#FFF"/>
            <path d="M7 12h5a3 3 0 0 1 0 6H7v-6z" fill="#FFF" fill-opacity="0.8"/>
          </svg>
        </div>
        <span class="brand-title">{{ title() }}</span>
      </a>

      <nav class="navbar-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          Overview
        </a>
        <a routerLink="/design-system" routerLinkActive="active" class="nav-link">
          Design Tokens & Components
        </a>
      </nav>

      <div class="navbar-meta">
        <span class="env-pill">Angular 22 · Standalone</span>
      </div>
    </div>
  </header>

  <!-- Main Routed Content Area -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Clean Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <p>Created for Figma Make & GitHub Experiments · Figma Angular Lab</p>
      <p class="footer-sub">TypeScript · SCSS · Standalone Components · Clean Routing</p>
    </div>
  </footer>
</div>
